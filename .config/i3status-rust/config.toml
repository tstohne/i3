# i3status-rust configuration file (0.33.x)
# Place this in ~/.config/i3status-rust/config.toml
#
# Style: every block sits on the bar background (#3f3f3f); state is shown by
# text color only, the same scheme as the xmobar thresholds
# (green = fine, yellow = warning, red = critical), with dim "│" separators.

[theme]
theme = "plain"
[theme.overrides]
idle_bg = "#3f3f3f"
idle_fg = "#dcdccc"
info_bg = "#3f3f3f"
info_fg = "#8cd0d3"
good_bg = "#3f3f3f"
good_fg = "#7f9f7f"
warning_bg = "#3f3f3f"
warning_fg = "#f0dfaf"
critical_bg = "#3f3f3f"
critical_fg = "#cc9393"
separator = "│"
separator_bg = "#3f3f3f"
separator_fg = "#656555"

[icons]
icons = "awesome4"

[[block]]
block = "net"
device = "wlan0"
interval = 5
format = " $icon $ssid.str(max_w:14) $signal_strength "
format_alt = " $icon ^icon_net_down $speed_down.eng(prefix:K) ^icon_net_up $speed_up.eng(prefix:K) "
missing_format = " $icon Disconnected "

# Bluetooth block may not be available in 0.33.2
# [[block]]
# block = "bluetooth"

[[block]]
block = "sound"
format = " $icon $volume "
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "cpu"
interval = 5
# $utilization already includes the % sign
format = " $icon $utilization "
info_cpu = 50
warning_cpu = 75
critical_cpu = 90

[[block]]
block = "memory"
format = " $icon $mem_used_percents "
format_alt = " $icon $swap_used_percents "
interval = 15
warning_mem = 80
warning_swap = 80
critical_mem = 95
critical_swap = 95

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
format = " $icon $available "
interval = 60
warning = 20.0
alert = 10.0

[[block]]
block = "battery"
driver = "upower"
format = " $icon $percentage $time "
full_format = " $icon $percentage "

# Remove backlight block if no devices found
# [[block]]
# block = "backlight"
# device = "intel_backlight"
# format = " $icon $brightness "

[[block]]
block = "time"
interval = 30
format = " $icon $timestamp.datetime(f:'%a %b %e  %H:%M') "
[[block.click]]
button = "left"
cmd = "gsimplecal"
